<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-labelledby="t d">
<title id="t">The two mails a starter conversation uses</title>
<desc id="d">Panel one is the request: a subject carrying the channel tag and a literal key block with cwd, model and a prompt block. Panel two is the reply the starter sends, threaded under the request, with the attach line and the exact stop command. Panel three lists the command replies. Panel four lists what stays silent.</desc>

<defs>
  <style>
    .h{font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#18212b}
    .b{font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#39434f}
    .mono{font:15.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#22303d}
    .mono-g{font:15.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#2f6f4f}
    .s{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#6a7683}
    .lbl{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#33404d}
    .card{fill:#fff;stroke:#cbd4de;stroke-width:1.6}
    .head{fill:#eef3f8;stroke:#d3dee9;stroke-width:1}
    .tint{fill:#f6f9f7;stroke:#84b097;stroke-width:1.4}
  </style>
</defs>

<!-- 1 request -->
<text class="h" x="24" y="42">1. You send the request</text>
<rect class="card" x="24" y="60" width="548" height="330" rx="14"/>
<rect class="head" x="24" y="60" width="548" height="40" rx="14"/>
<text class="lbl" x="44" y="86">New mail</text>

<text class="s" x="44" y="132">To</text>
<text class="mono" x="92" y="132">you@qq.com, or starter.channel.address</text>
<text class="s" x="44" y="162">Subject</text>
<text class="mono" x="124" y="162">[pi-start] fix the flaky auth test</text>

<line x1="44" y1="184" x2="552" y2="184" stroke="#e2e8ee"/>

<text class="mono" x="44" y="216">cwd:    ~/Work/myapp</text>
<text class="mono" x="44" y="244">model:  deepseek/deepseek-flash</text>
<text class="mono" x="44" y="272">prompt: |</text>
<text class="mono" x="68" y="300">The auth test is flaky on CI.</text>
<text class="mono" x="68" y="328">Reproduce it, fix it, run the suite.</text>

<text class="s" x="44" y="364">The subject tag selects the channel. Values are literal:</text>

<!-- 2 result -->
<text class="h" x="612" y="42">2. It answers in the same thread</text>
<rect class="card" x="612" y="60" width="564" height="330" rx="14"/>
<rect class="head" x="612" y="60" width="564" height="40" rx="14"/>
<text class="lbl" x="632" y="86">Re: [pi-start] fix the flaky auth test</text>

<text class="mono-g" x="632" y="132">[pi-start] started fix-the-auth-test</text>
<text class="mono" x="632" y="160">cwd:    ~/Work/myapp</text>
<text class="mono" x="632" y="188">model:  deepseek/deepseek-flash</text>
<text class="mono" x="632" y="216">attach: tmux -L pimail attach -t fix-the-auth-test</text>
<text class="mono" x="632" y="244">stop:   reply with "stop: fix-the-auth-test"</text>

<line x1="632" y1="266" x2="1156" y2="266" stroke="#e2e8ee"/>
<text class="s" x="632" y="294">Threaded under the request with In-Reply-To and References.</text>
<text class="s" x="632" y="320">Refused requests answer with the reason instead.</text>
<text class="s" x="632" y="352">A reply that is not a command is never a new request.</text>

<!-- captions under row 1 -->
<text class="s" x="44" y="418">no quotes, no inline comments, one block at the top</text>
<text class="s" x="632" y="418">prompt defaults to "hi"; a started result is retried, a refusal is not</text>

<!-- 3 commands -->
<text class="h" x="24" y="470">3. Commands it reads and answers</text>
<rect class="tint" x="24" y="488" width="548" height="336" rx="14"/>

<text class="mono" x="48" y="528">stop: fix-the-auth-test</text>
<text class="mono-g" x="48" y="556">&#8594; [pi-start] stopped fix-the-auth-test</text>
<text class="mono" x="48" y="600">stop: all</text>
<text class="mono-g" x="48" y="628">&#8594; [pi-start] a stopped, b stopped</text>
<text class="mono" x="48" y="672">list:</text>
<text class="mono-g" x="48" y="700">&#8594; [pi-start] sessions</text>

<text class="s" x="48" y="750">Commands carry no start fields.</text>
<text class="s" x="48" y="776">Anything else in a reply is refused, not run.</text>
<text class="s" x="48" y="802">To start, send a new mail.</text>

<!-- 4 silence -->
<text class="h" x="612" y="470">4. What gets no reply</text>
<rect class="card" x="612" y="488" width="564" height="336" rx="14"/>

<text class="b" x="636" y="528">A stranger, a robot, a bounce</text>
<text class="s" x="636" y="552">ignored, so no backscatter</text>

<text class="b" x="636" y="596">Our own mail looping back</text>
<text class="s" x="636" y="620">ignored by the marker header</text>

<text class="b" x="636" y="664">Off-channel, replayed, stale</text>
<text class="s" x="636" y="688">ignored before any reply</text>

<text class="b" x="636" y="732">A reply that is not a command</text>
<text class="s" x="636" y="756">refused with a reason, never started</text>

<text class="s" x="636" y="800">The watcher log says which gate, e.g. unauthenticated:self</text>
</svg>
