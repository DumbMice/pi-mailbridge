<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" role="img" aria-labelledby="t d">
<title id="t">The two mails a starter conversation uses</title>
<desc id="d">Panel one is the request: a subject carrying the channel tag and a literal key block with cwd, model and a prompt block. Panel two is the reply the starter sends, threaded under the request, with the attach line and the exact stop command. Panel three lists the command replies. Panel four lists what stays silent.</desc>
<defs>
  <style>
    .h{font:600 23px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#18212b}
    .b{font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#39434f}
    .mono{font:16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#22303d}
    .mono-g{font:16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#2f6f4f}
    .s{font:15.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#6a7683}
    .lbl{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#33404d}
    .card{fill:#fff;stroke:#cbd4de;stroke-width:1.6}
    .head{fill:#eef3f8;stroke:#d3dee9;stroke-width:1}
    .tint{fill:#f6f9f7;stroke:#84b097;stroke-width:1.4}
  </style>
</defs>

<text class="h" x="16" y="34">1. You send the request</text>
<rect class="card" x="16" y="50" width="476" height="322" rx="14"/>
<rect class="head" x="16" y="50" width="476" height="40" rx="14"/>
<text class="lbl" x="36" y="77">New mail</text>
<text class="s" x="36" y="126">To</text>
<text class="mono" x="72" y="126">you@qq.com or the starter address</text>
<text class="s" x="36" y="158">Subject</text>
<text class="mono" x="112" y="158">[pi-start] fix the flaky auth test</text>
<line x1="36" y1="178" x2="472" y2="178" stroke="#e2e8ee"/>
<text class="mono" x="36" y="210">cwd:    ~/Work/myapp</text>
<text class="mono" x="36" y="238">model:  deepseek/deepseek-flash</text>
<text class="mono" x="36" y="266">prompt: |</text>
<text class="mono" x="58" y="294">The auth test is flaky on CI.</text>
<text class="mono" x="58" y="322">Reproduce it, fix it, run the suite.</text>
<text class="s" x="36" y="354">Values are literal: no quotes, no comments.</text>

<text class="h" x="516" y="34">2. It answers in the thread</text>
<rect class="card" x="516" y="50" width="468" height="322" rx="14"/>
<rect class="head" x="516" y="50" width="468" height="40" rx="14"/>
<text class="lbl" x="536" y="77">Re: [pi-start] fix the flaky auth test</text>
<text class="mono-g" x="536" y="126">[pi-start] started fix-the-auth-test</text>
<text class="mono" x="536" y="154">cwd:    ~/Work/myapp</text>
<text class="mono" x="536" y="182">model:  deepseek/deepseek-flash</text>
<text class="mono" x="536" y="210">attach: tmux -L pimail attach -t &lt;name&gt;</text>
<text class="mono" x="536" y="238">stop:   reply with "stop: &lt;name&gt;"</text>
<line x1="536" y1="258" x2="964" y2="258" stroke="#e2e8ee"/>
<text class="s" x="536" y="286">Threaded with In-Reply-To and References.</text>
<text class="s" x="536" y="312">A refusal answers with the reason.</text>
<text class="s" x="536" y="338">A reply that is not a command never starts one.</text>

<text class="s" x="36" y="402">the tag is the channel; prompt: | takes the lines below</text>
<text class="s" x="536" y="402">a started result is retried; a swallowed refusal is not</text>

<text class="h" x="16" y="452">3. Commands it reads and answers</text>
<rect class="tint" x="16" y="470" width="476" height="290" rx="14"/>
<text class="mono" x="40" y="510">stop: fix-the-auth-test</text>
<text class="mono-g" x="40" y="538">&#8594; [pi-start] stopped fix-the-auth-test</text>
<text class="mono" x="40" y="578">stop: all</text>
<text class="mono-g" x="40" y="606">&#8594; [pi-start] a stopped, b stopped</text>
<text class="mono" x="40" y="646">list:</text>
<text class="mono-g" x="40" y="674">&#8594; [pi-start] sessions</text>
<text class="s" x="40" y="704">Commands carry no start fields. Anything else</text>
<text class="s" x="40" y="726">in a reply is refused, never run. To start,</text>
<text class="s" x="40" y="748">send a new mail.</text>

<text class="h" x="516" y="452">4. What gets no reply</text>
<rect class="card" x="516" y="470" width="468" height="290" rx="14"/>
<text class="b" x="540" y="510">A stranger, a robot, a bounce</text>
<text class="s" x="540" y="534">ignored, so no backscatter</text>
<text class="b" x="540" y="578">Our own mail looping back</text>
<text class="s" x="540" y="602">ignored by the marker header</text>
<text class="b" x="540" y="646">Off-channel, replayed, stale</text>
<text class="s" x="540" y="670">ignored before any reply</text>
<text class="b" x="540" y="714">A reply that is not a command</text>
<text class="s" x="540" y="738">refused with a reason, never started</text>
</svg>
