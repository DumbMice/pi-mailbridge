<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="1000" height="530" role="img" aria-labelledby="t d">
<title id="t">How a notification and a reply travel</title>
<desc id="d">Four stations: pi session, daemon, your mailbox, you. The session sends through the daemon over SMTP; you reply from any device; the daemon reads it over IMAP, authorizes, routes and persists it; the session claims it, injects it and acknowledges, which marks the mail seen.</desc>

<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10z" fill="#5b6673"/>
  </marker>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10z" fill="#2f6f4f"/>
  </marker>
  <style>
    .h{font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#18212b}
    .b{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#39434f}
    .s{font:14.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#6a7683}
    .pt{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#33404d}
    .num{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#fff}
    .flow{stroke:#5b6673;stroke-width:2;fill:none}
    .flow-g{stroke:#2f6f4f;stroke-width:2.2;fill:none}
    .ic{stroke:#3d4854;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .ic-g{stroke:#2f6f4f;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .pill{fill:#eef3f8;stroke:#d3dee9;stroke-width:1}
  </style>
</defs>

<!-- pi session -->
<rect x="16" y="190" width="196" height="150" rx="14" fill="#fff" stroke="#cbd4de" stroke-width="1.5"/>
<g transform="translate(32,206)">
  <rect class="ic" x="0" y="0" width="30" height="23" rx="4"/>
  <path class="ic" d="M5 6 l5 5 -5 5"/>
  <path class="ic" d="M14 16 h7"/>
</g>
<text class="h" x="72" y="224">pi session</text>
<text class="b" x="32" y="258">finishes a turn</text>
<text class="b" x="32" y="282">→ one mail</text>
<text class="b" x="32" y="306">reply: next message</text>

<!-- daemon -->
<rect x="360" y="136" width="376" height="268" rx="16" fill="#f6f9f7" stroke="#84b097" stroke-width="1.6"/>
<g transform="translate(380,154)">
  <path class="ic-g" d="M15 1 l12 5 v8 c0 7 -5 12 -12 15 c-7 -3 -12 -8 -12 -15 v-8 z"/>
  <path class="ic-g" d="M10 15 l4 4 7 -8"/>
</g>
<text class="h" x="424" y="172">daemon</text>
<text class="s" x="424" y="192">one per machine · loopback</text>

<g>
  <rect class="pill" x="380" y="212" width="82" height="28" rx="14"/><text class="pt" x="396" y="231">scan</text>
  <rect class="pill" x="470" y="212" width="112" height="28" rx="14"/><text class="pt" x="486" y="231">authorize</text>
  <rect class="pill" x="590" y="212" width="82" height="28" rx="14"/><text class="pt" x="606" y="231">route</text>
  <rect class="pill" x="380" y="250" width="292" height="28" rx="14"/><text class="pt" x="396" y="269">strip quote · attach · persist</text>
</g>

<text class="s" x="380" y="302">cursor moves after the record is saved</text>
<text class="s" x="380" y="324">IMAP IDLE + a 60 s sweep</text>

<g transform="translate(380,338)">
  <ellipse class="ic" cx="14" cy="5" rx="14" ry="5"/>
  <path class="ic" d="M0 5 v14 c0 2.8 6.3 5 14 5 s14 -2.2 14 -5 V5"/>
  <path class="ic" d="M0 12 c0 2.8 6.3 5 14 5 s14 -2.2 14 -5"/>
</g>
<text class="s" x="418" y="356">pending · journal · cursor</text>

<!-- mailbox -->
<rect x="356" y="28" width="292" height="72" rx="14" fill="#fff" stroke="#cbd4de" stroke-width="1.5"/>
<g transform="translate(374,44)">
  <rect class="ic" x="0" y="0" width="38" height="27" rx="4"/>
  <path class="ic" d="M1 3 l18 12 18 -12"/>
</g>
<text class="h" x="428" y="54">your mailbox</text>
<text class="s" x="428" y="76">INBOX, read by the daemon</text>

<!-- you -->
<rect x="764" y="196" width="212" height="120" rx="14" fill="#fff" stroke="#cbd4de" stroke-width="1.5"/>
<g transform="translate(782,212)">
  <rect class="ic" x="0" y="0" width="20" height="33" rx="4"/>
  <path class="ic" d="M6 27 h8"/>
  <path class="ic" d="M6 5 h8"/>
</g>
<text class="h" x="814" y="230">you</text>
<text class="b" x="782" y="270">any device with email</text>
<text class="b" x="782" y="294">reply, don't compose</text>

<!-- 1 send -->
<path class="flow" d="M216 236 H352" marker-end="url(#a)"/>
<circle cx="330" cy="236" r="12" fill="#5b6673"/><text class="num" x="325" y="241">1</text>
<text class="s" x="222" y="226">send</text>

<!-- 2 SMTP -->
<path class="flow" d="M570 136 V104" marker-end="url(#a)"/>
<circle cx="570" cy="120" r="12" fill="#5b6673"/><text class="num" x="565" y="125">2</text>
<text class="s" x="588" y="125">SMTP</text>

<!-- 3 notification -->
<path class="flow" d="M648 62 H870 V192" marker-end="url(#a)"/>
<circle cx="760" cy="62" r="12" fill="#5b6673"/><text class="num" x="755" y="67">3</text>
<text class="s" x="778" y="52">notification</text>

<!-- 4 reply -->
<path class="flow-g" d="M828 196 V92 H648" marker-end="url(#g)"/>
<circle cx="828" cy="144" r="12" fill="#2f6f4f"/><text class="num" x="823" y="149">4</text>
<text class="s" x="690" y="112">your reply</text>

<!-- 5 IMAP -->
<path class="flow-g" d="M450 104 V132" marker-end="url(#g)"/>
<circle cx="450" cy="118" r="12" fill="#2f6f4f"/><text class="num" x="445" y="123">5</text>
<text class="s" x="468" y="123">IMAP</text>

<!-- 6 claim -->
<path class="flow" d="M352 286 H216" marker-end="url(#a)"/>
<circle cx="330" cy="286" r="12" fill="#5b6673"/><text class="num" x="325" y="291">6</text>
<text class="s" x="222" y="276">claim</text>

<!-- 7 ack -->
<path class="flow-g" d="M216 320 H352" marker-end="url(#g)"/>
<circle cx="330" cy="320" r="12" fill="#2f6f4f"/><text class="num" x="325" y="325">7</text>
<text class="s" x="222" y="340">ack → seen</text>

<!-- footer -->
<line x1="24" y1="428" x2="976" y2="428" stroke="#e2e8ef"/>
<text class="b" x="24" y="454">Every inbound message passes, in order:</text>
<text class="s" x="24" y="480">journal → marker → size → From → loop guard → allowlist → DMARC → Message-ID → route → ack</text>
<text class="s" x="24" y="506">Routing ids never authorize. Mail is marked seen only after the reply is injected and acked.</text>
</svg>
